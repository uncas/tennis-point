<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <title>Klubbens Tennis Rangliste & Kampe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f7f6;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 20px;
    }

    .tab-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      background-color: #e0e0e0;
      color: #333;
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      transition: background-color 0.2s;
    }

    .tab-btn.active {
      background-color: #27ae60;
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 700px;
      background: white;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th,
    td {
      padding: 12px 15px;
      text-align: left;
    }

    th {
      background-color: #27ae60;
      color: white;
      font-weight: bold;
    }

    tr:nth-child(even) {
      background-color: #f8f9fa;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .rank {
      font-weight: bold;
      width: 50px;
      text-align: center;
    }

    #error-log {
      margin-top: 30px;
      padding: 15px;
      background-color: #fce4e4;
      border: 1px solid #f5c6cb;
      color: #721c24;
      border-radius: 5px;
      font-family: monospace;
      white-space: pre-wrap;
      max-width: 700px;
      display: none;
    }
  </style>
</head>

<body>

  <h1>🎾 Klubbens Tennis</h1>

  <div class="tab-container">
    <button class="tab-btn active" onclick="switchTab(event, 'rangliste-tab')">Rangliste</button>
    <button class="tab-btn" onclick="switchTab(event, 'kampe-tab')">Kampe</button>
  </div>

  <!-- Tab 1: Rangliste -->
  <div id="rangliste-tab" class="tab-content active">
    <table id="rangliste">
      <thead>
        <tr>
          <th class="rank">#</th>
          <th>Spiller</th>
          <th>Point</th>
          <th>Kampe (V-T)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="4">Beregner rangliste...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Tab 2: Kampe -->
  <div id="kampe-tab" class="tab-content">
    <table id="kampe">
      <thead>
        <tr>
          <th>Dato</th>
          <th>Spiller 1</th>
          <th>Spiller 2</th>
          <th>Resultat</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="4">Henter kampe...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div id="error-log"></div>

  <script>
    // Publiceret CSV-link til kamp-arket (Dato, Spiller 1, Spiller 2, Resultat)
    const KAMPE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSI5joyPdSapNRkesKnxqAyC-W-3enWrXgdI3IgBqGzNA1-1RIu-3A22XRbd1ac4Y3kiBcr_08q9umT/pub?output=csv';

    function switchTab(event, tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // CSV parser der håndterer værdier i citationstegn (f.eks. "6-4, 6-2")
    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    }

    async function loadData() {
      try {
        const response = await fetch(KAMPE_CSV_URL);
        if (!response.ok) {
          throw new Error(`Fejl ved hentning af CSV (${response.status} ${response.statusText})`);
        }

        const rawText = await response.text();
        const lines = rawText.trim().split(/\r?\n/);
        lines.shift(); // Fjern overskrifter (Dato, Spiller 1, Spiller 2, Resultat)

        const matches = [];
        const players = {}; // Structure: { "Navn": { point: 0, wins: 0, losses: 0 } }

        lines.forEach(line => {
          if (!line.trim()) return;
          const row = parseCSVLine(line);

          const dato = row[0] || '-';
          const s1 = row[1];
          const s2 = row[2];

          // Fjern punktummer og ekstra mellemrum fra resultatet
          const resultat = (row[3] || '').replace(/\./g, '').trim();

          if (!s1 || !s2) return;

          // Opret spillere i objektet hvis de ikke findes endnu
          if (!players[s1]) players[s1] = { point: 0, wins: 0, losses: 0 };
          if (!players[s2]) players[s2] = { point: 0, wins: 0, losses: 0 };

          matches.push({ dato, s1, s2, resultat });

          // Beregn kampens vinder ud fra sætstillingen
          if (resultat) {
            let s1Sets = 0;
            let s2Sets = 0;

            // Opsplit pr. sæt (f.eks. "6-4, 6-2" -> ["6-4", "6-2"])
            const sets = resultat.split(',').map(s => s.trim());
            sets.forEach(setItem => {
              // Parse kun selve tallene fra hver side af bindestregen
              const parts = setItem.split('-');
              if (parts.length === 2) {
                const p1Games = parseInt(parts[0].replace(/\D/g, ''), 10);
                const p2Games = parseInt(parts[1].replace(/\D/g, ''), 10);

                if (!isNaN(p1Games) && !isNaN(p2Games)) {
                  if (p1Games > p2Games) s1Sets++;
                  else if (p2Games > p1Games) s2Sets++;
                }
              }
            });

            // Tildel point baseret på vundne sæt
            if (s1Sets > s2Sets) {
              players[s1].point += 3;
              players[s1].wins += 1;
              players[s2].point += 1;
              players[s2].losses += 1;
            } else if (s2Sets > s1Sets) {
              players[s2].point += 3;
              players[s2].wins += 1;
              players[s1].point += 1;
              players[s1].losses += 1;
            }
          }
        });
        renderKampe(matches);
        renderRangliste(players);

      } catch (error) {
        logError(error);
      }
    }

    function renderKampe(matches) {
      const tbody = document.querySelector('#kampe tbody');
      tbody.innerHTML = '';

      matches.forEach(m => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${m.dato}</td>
          <td>${m.s1}</td>
          <td>${m.s2}</td>
          <td><strong>${m.resultat || '-'}</strong></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderRangliste(players) {
      const tbody = document.querySelector('#rangliste tbody');
      tbody.innerHTML = '';

      // Konverter spillere til et array og sorter efter point (flest point først)
      const sortedPlayers = Object.keys(players)
        .map(name => ({ name, ...players[name] }))
        .sort((a, b) => b.point - a.point || b.wins - a.wins);

      sortedPlayers.forEach((p, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="rank">${index + 1}</td>
          <td>${p.name}</td>
          <td><strong>${p.point}</strong></td>
          <td>${p.wins}-${p.losses}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function logError(error) {
      console.error('Fejl:', error);
      const errorLog = document.getElementById('error-log');
      errorLog.style.display = 'block';
      errorLog.textContent = `[DEBUG ERROR]\n${error.stack || error.toString()}`;
    }

    loadData();
  </script>
</body>

</html>
